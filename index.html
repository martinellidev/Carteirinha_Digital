<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carteirinha Digital</title>
<link rel="stylesheet" href="src/style.css">
<link rel="shortcut icon" href="img/logo.png" type="image/x-icon">
</head>
<body>
<div class="app">
  <header>
    <button aria-label="Voltar"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 5l-7 7 7 7"/></svg></button>
    <div class="logo">
      <svg width="30" height="36" viewBox="0 0 30 36"><path d="M15 1C7 1 1 7 1 15c0 8 6 12 10 14l4 6 4-6c5-2 10-6 10-14C29 7 23 1 15 1z" fill="#1b2a8a"/><path d="M11 9l9 11" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>
      carteirinha
    </div>
    <button aria-label="Atualizar"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 3v5h-5" fill="var(--muted)"/></svg></button>
  </header>

  <main>
    <div class="card" role="img" aria-label="Carteirinha digital com dados de exemplo">
      <div class="photo">
        <svg viewBox="0 0 100 83" aria-hidden="true"><rect width="100" height="83" fill="#fff"/><circle cx="40" cy="30" r="14" fill="#c9ccd3"/><path d="M12 83c2-22 14-32 28-32s26 10 28 32z" fill="#c9ccd3"/></svg>
      </div>
      <div class="vtext left">NOME DO ALUNO<small>Instituição de ensino</small></div>
      <svg class="star" viewBox="0 0 60 60" aria-hidden="true"><path d="M30 4l7 17 18 2-14 12 5 18-16-10-16 10 5-18L5 23l18-2z" fill="none" stroke="#2fd39a" stroke-width="3" stroke-linejoin="round"/></svg>
      <div class="vtext right1">CURSO (COMUM/GRADUADO)<small>RGM: 000000000</small></div>
      <div class="vtext right2">CIÊNCIA DA COMPUTAÇÃO<small>Válido até 12/2026</small></div>
    </div>
    <div class="dots" aria-hidden="true"><i></i><i></i></div>
    <button class="cta">Solicitar Carteirinha Física</button>
  </main>

  <nav>
    <button><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3L2 12h3v8h5v-6h4v6h5v-8h3z"/></svg>Início</button>
    <button class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="2" width="12" height="20" rx="2"/><circle cx="12" cy="10" r="2" fill="currentColor"/><path d="M8.5 16c.6-2 2-3 3.5-3s2.900 1 3.500 3" stroke-linecap="round"/></svg>Carteirinha<br>Digital</button>
    <button><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 8h18v4H3zM4 13h16v8H4zM11 8h2v13h-2z"/><path d="M12 8C9 8 8 4 10 4s2 4 2 4zm0 0c3 0 4-4 2-4s-2 4-2 4z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>Ofertas</button>
    <button><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 3h8v8H3zm2 2v4h4V5zM13 3h8v8h-8zm2 2v4h4V5zM3 13h8v8H3zm2 2v4h4v-4zM13 13h3v3h-3zm5 0h3v3h-3zm-5 5h3v3h-3zm5 0h3v3h-3z"/></svg>QRCode</button>
  </nav>
</div>
</body>
</html>
